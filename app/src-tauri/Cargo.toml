[package]
name = "moqi-project-b-native"
version = "0.6.2"
edition = "2021"
license = "AGPL-3.0-or-later"

# Tauri 2 的移动端（Android）要求壳入口住在 lib 里并带 `mobile_entry_point`；
# 这三种 crate-type 是 Tauri 移动端的硬要求（staticlib 给 Android 链接、cdylib 给动态链接、
# rlib 给 `main.rs` 与单测用）。`name` 必须与 `main.rs` 里调用的 crate 名一致。
[lib]
name = "moqi_project_b_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 版本地板见 `03` §12.4（T-16 锁这里）：tauri 2.12.1 ⇒ 带出 wry ^0.57 / tao ^0.37。
tauri = { version = "2.12.1", features = ["protocol-asset"] }
# 插件轮（0.6 第 11 项）：dialog = 桌面原生对话框 ＋ 移动端 SAF 选文件；fs = 落盘；opener = 打开目录 / 外链。
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6"
tauri-plugin-opener = "2"
# 剪贴板（`D-090`）：Android WebView 把 `navigator.clipboard` 整体拒掉
#（`NotAllowedError: Write permission denied`）⇒ 原生 `ClipboardManager` 走这个插件。
tauri-plugin-clipboard-manager = "2.5.0"
# Markdown 导出打包（`13-导出与媒体设计` §7）：压缩在 Rust 侧做，TS 不引打包库。
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
# 资产字节走 base64（`13-媒体设计` §3 的哑写；不预先优化成原始字节通道）。
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }
